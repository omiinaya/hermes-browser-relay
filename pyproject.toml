[project]
name = "browser-relay"
version = "2.4.2"
description = "Remote Chrome/Chromium browser control via CDP — Hermes plugin and MCP server"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "omiinaya", email = "omiinaya@gmail.com" },
]
keywords = ["chrome", "cdp", "hermes", "browser-automation", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "aiohttp",
    "websockets",
    "Pillow",
    "mcp>=1.0.0",
]
[project.urls]
Homepage = "https://github.com/omiinaya/browser-relay"
Repository = "https://github.com/omiinaya/browser-relay"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.5.0",
]

[project.scripts]
browser-relay-server = "server:main"

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint.per-file-ignores]
"mcp-server/server.py" = ["E402"]
"plugins/browser-relay/__init__.py" = ["E402"]
"tests/*" = ["E402"]
"mcp-server/tests/*" = ["E402"]
"cdp.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "mcp-server/tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks end-to-end tests that require a real browser (Chromium)",
]
