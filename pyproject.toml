[tool.ruff]
# ruff configuration for browser-relay
target-version = "py310"
line-length = 160

[tool.ruff.lint]
per-file-ignores = { "mcp-server/server.py" = ["E402"], "plugins/browser-relay/__init__.py" = ["E402"], "tests/*" = ["E402"], "mcp-server/tests/*" = ["E402"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "mcp-server/tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks end-to-end tests that require a real browser (Chromium)",
]
